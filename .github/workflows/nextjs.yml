# Sample workflow for building and deploying a Next.js site to GitHub Pages
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
This error happens because a file named **`nextjs.yml`** already exists inside your `.github/workflows/` folder. GitHub won't let you create a brand-new file with the exact same name.

### How to fix it:

* **Option 1: Edit the existing file (Recommended)**
  1. Cancel out of this creation screen.
  2. Go back to your repository files, navigate to `.github` > `workflows`, and click on **`nextjs.yml`**.
  3. Click the **pencil icon** (Edit this file) to make changes to your existing configuration instead of making a duplicate.

* **Option 2: Delete and recreate**
  1. Go to `.github/workflows/` and delete the old `nextjs.yml` file.
  2. Come back and try creating the new one. 

If you just need to update your workflow script, editing the current file (Option 1) is the quickest way forward!
